name: Create and publish a Pre-Release Image

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing pre-release tag to build (e.g. v3.1.0-beta)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build-and-push-image:
    needs: [lint, test]
    uses: ./.github/workflows/docker-build.yml
    with:
      registry_image: ghcr.io/${{ github.repository }}
      dockerhub_image: thegameprofi/scraparr
      ref: ${{ inputs.tag || github.ref }}
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || '' }}
        type=raw,value=beta
    secrets: inherit
