name: Cleanup Stale PR Images

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of each month at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed-PR images older than 30 days
        run: |
          PACKAGE="scraparr-dev"
          REPO="${{ github.repository }}"
          CUTOFF=$(date -d '30 days ago' --iso-8601=seconds)

          gh api "/user/packages/container/${PACKAGE}/versions" --paginate \
            --jq '.[] | select(.metadata.container.tags | map(test("^pr[0-9]+$")) | any)
                      | {id: .id, created_at: .created_at,
                         tag: (.metadata.container.tags[] | select(test("^pr[0-9]+$")))}' \
          | while IFS= read -r entry; do
              VERSION_ID=$(echo "$entry" | jq -r '.id')
              CREATED_AT=$(echo "$entry" | jq -r '.created_at')
              TAG=$(echo "$entry" | jq -r '.tag')
              PR_NUMBER=$(echo "$TAG" | grep -oP '\d+')

              if [[ "$CREATED_AT" > "$CUTOFF" ]]; then
                echo "Skipping $TAG (newer than 30 days, created $CREATED_AT)"
                continue
              fi

              PR_STATE=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.state' 2>/dev/null || echo "not_found")

              if [[ "$PR_STATE" == "closed" || "$PR_STATE" == "not_found" ]]; then
                echo "Deleting $TAG (PR #${PR_NUMBER} state: ${PR_STATE}, created: ${CREATED_AT})"
                gh api --method DELETE "/user/packages/container/${PACKAGE}/versions/${VERSION_ID}"
              else
                echo "Keeping $TAG (PR #${PR_NUMBER} is ${PR_STATE})"
              fi
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
