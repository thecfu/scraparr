name: Remove the Image of the PR

on:
  pull_request:
    types: closed
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  remove-image:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR image from registry
        run: |
          VERSION_ID=$(gh api /user/packages/container/scraparr-dev/versions \
            --jq '.[] | select(.metadata.container.tags[] == "pr${{ github.event.pull_request.number }}") | .id')
          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE /user/packages/container/scraparr-dev/versions/$VERSION_ID
            echo "Deleted image version $VERSION_ID"
          else
            echo "No image found for pr${{ github.event.pull_request.number }}, skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
