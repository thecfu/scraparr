name: Create and publish a Image for the PR

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-and-push-image:
    uses: ./.github/workflows/docker-build.yml
    with:
      registry_image: ghcr.io/thecfu/scraparr-dev
      tags: type=raw,value=pr${{ github.event.pull_request.number }}
    secrets: inherit
