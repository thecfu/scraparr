name: Docker Build and Push (Shared)

on:
  workflow_call:
    inputs:
      codeberg_image:
        description: 'Codeberg container registry image path (e.g. codeberg.org/owner/repo)'
        required: true
        type: string
      ghcr_image:
        description: 'GHCR image path (e.g. ghcr.io/owner/repo); leave empty to skip'
        required: false
        type: string
        default: ''
      dockerhub_image:
        description: 'Docker Hub image name; leave empty to skip Docker Hub'
        required: false
        type: string
        default: ''
      tags:
        description: 'docker/metadata-action tag patterns'
        required: false
        type: string
        default: ''
      flavor:
        description: 'docker/metadata-action flavor string'
        required: false
        type: string
        default: ''
      check_latest_tag:
        description: 'Query Codeberg Releases API to set latest=true/false flavor'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Environment to run the build job under (for protection rules)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout (tag, branch, SHA). Defaults to triggering ref.'
        required: false
        type: string
        default: ''
    outputs:
      digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to Codeberg Container Registry
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: inputs.ghcr_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.dockerhub_image != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Latest Tag
        if: inputs.check_latest_tag
        id: latest_tag
        run: |
          LATEST_TAG=$(curl -s "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases?limit=1&draft=false&pre-release=false" | jq -r '.[0].tag_name')
          if [[ "$LATEST_TAG" == "${{ github.ref_name }}" ]]; then
            echo "flavor=latest=true" >> $GITHUB_OUTPUT
          else
            echo "flavor=latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.codeberg_image }}
            ${{ inputs.ghcr_image }}
            ${{ inputs.dockerhub_image }}
          flavor: ${{ inputs.check_latest_tag && steps.latest_tag.outputs.flavor || inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
