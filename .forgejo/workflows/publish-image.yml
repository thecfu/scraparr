name: Create and publish a Release Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v3.0.3)'
        required: true
        type: string

jobs:
  lint:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    uses: ./.forgejo/workflows/lint.yml

  test:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    uses: ./.forgejo/workflows/test.yml

  build-and-push-image:
    needs: [lint, test]
    uses: ./.forgejo/workflows/docker-build.yml
    with:
      codeberg_image: codeberg.org/thecfu/scraparr
      ghcr_image: ghcr.io/thecfu/scraparr
      dockerhub_image: thegameprofi/scraparr
      ref: ${{ inputs.tag || github.ref }}
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || '' }}
        type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || '' }}
        type=semver,pattern={{major}},value=${{ inputs.tag || '' }}
      check_latest_tag: true
    secrets: inherit
