name: Create and publish a Pre-Release Image

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing pre-release tag to build (e.g. v3.1.0-beta)'
        required: true
        type: string

jobs:
  lint:
    uses: ./.forgejo/workflows/lint.yml

  test:
    uses: ./.forgejo/workflows/test.yml

  build-and-push-image:
    needs: [lint, test]
    uses: ./.forgejo/workflows/docker-build.yml
    with:
      codeberg_image: codeberg.org/thecfu/scraparr
      ghcr_image: ghcr.io/thecfu/scraparr
      dockerhub_image: thegameprofi/scraparr
      ref: ${{ inputs.tag || github.ref }}
      tags: |
        type=semver,pattern={{version}},value=${{ inputs.tag || '' }}
        type=raw,value=beta
    secrets: inherit
