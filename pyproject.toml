[project]
name = "scraparr"
version = "1.0.0"
description = "Prometheus Exporter for *Arr Suite"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
scraparr = "scraparr.scraparr:main"

[tool.setuptools.dynamic]
dependencies = {file = ["src/scraparr/requirements.txt"]}

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/scraparr"]
branch = true

[tool.coverage.report]
fail_under = 0

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "pylint>=3.0.0",
]
